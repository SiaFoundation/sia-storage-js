name: Prepare Release

on:
  push:
    branches: [main]

# Concurrent runs both force-push `release`, so the one that finishes last wins.
# If that is the run from the earlier commit, the release PR drops the newer
# change files.
concurrency: prepare-release

# GITHUB_TOKEN needs both: contents write to force-push `release`, pull requests
# write for create-release-pr.ts. RELEASE_PAT must carry the same two; without
# the second the branch push succeeds and createPullRequest fails.
permissions:
  contents: write
  pull-requests: write

# Used by the checkout (knope's `git push` inherits it) and by knope's API
# calls. A PR opened by GITHUB_TOKEN does not start its own checks; they wait on
# a maintainer clicking "Approve and run". Switch to RELEASE_PAT, which acts as
# a real user, once it holds pull requests write.
env:
  RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # RELEASE_TOKEN: ${{ secrets.RELEASE_PAT }}

jobs:
  prepare-release:
    if: "!contains(github.event.head_commit.message, 'chore: release')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          token: ${{ env.RELEASE_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.22.2

      # knope prepare-release errors when there's nothing to release, which is
      # most pushes. Gating on change-file presence keeps that quiet where a
      # blanket continue-on-error would also hide a real knope, gh, or git
      # failure. (ignore_conventional_commits in knope.toml makes change files
      # the only release trigger.)
      - name: Check for pending changes
        id: changes
        run: |
          if ls .changeset/*.md >/dev/null 2>&1; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changes.outputs.pending == 'true'
        run: knope prepare-release --verbose
        env:
          GITHUB_TOKEN: ${{ env.RELEASE_TOKEN }}
