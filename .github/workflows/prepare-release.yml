name: Prepare Release

on:
  push:
    branches: [main]

# Concurrent runs both force-push `release`, so the one that finishes last wins.
# If that is the run from the earlier commit, the release PR drops the newer
# change files.
concurrency: prepare-release

# The default token does nothing here. The branch push and the pull request
# both go through the app token minted below.
permissions:
  contents: read

jobs:
  prepare-release:
    if: "!contains(github.event.head_commit.message, 'chore: release')"
    runs-on: ubuntu-latest
    steps:
      # An app token, not GITHUB_TOKEN: a pull request opened with the workflow
      # token triggers no workflows, so the release PR's required `test` check
      # never runs and it cannot merge.
      - name: Mint bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SIA_CI_BOT_APP_ID }}
          private-key: ${{ secrets.SIA_CI_BOT_PRIVATE_KEY }}
          # Contents to force-push `release`, pull requests for
          # create-release-pr.ts. Without the second the branch push succeeds
          # and the PR create fails.
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          # knope force-pushes `release` later in the run, using the credentials
          # checkout saves here.
          token: ${{ steps.bot-token.outputs.token }}

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.22.2

      # knope prepare-release errors when there's nothing to release, which is
      # most pushes. Gating on change-file presence keeps that quiet where a
      # blanket continue-on-error would also hide a real knope, gh, or git
      # failure. (ignore_conventional_commits in knope.toml makes change files
      # the only release trigger.)
      - name: Check for pending changes
        id: changes
        run: |
          if ls .changeset/*.md >/dev/null 2>&1; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changes.outputs.pending == 'true'
        run: knope prepare-release --verbose
        env:
          # Read both by knope's own API calls and by the `gh` that
          # create-release-pr.ts shells out to.
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
